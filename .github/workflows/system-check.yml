# Morning system check: tests both Wintertuin apps (team app and Finance) before the day starts.
# Result: Settings > System check in either app. When something is red this job fails,
# and GitHub sends a "workflow failed" e-mail (github.com > Settings > Notifications > Actions).
name: Morning system check

on:
  schedule:
    - cron: '25 4 * * *'   # 04:25 UTC = 06:25 in Amsterdam in summer, 05:25 in winter
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/system-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run the system check
        run: |
          set -o pipefail
          curl -fsS --retry 3 --retry-delay 30 --max-time 150 -X POST \
            "https://foaoyjxzclvvdhuxvsck.supabase.co/functions/v1/system-check" \
            -H "Content-Type: application/json" -d '{}' > result.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('result.json')).get('data', {})
          status = d.get('status')
          print(f"Overall: {status}{' (result of a check less than 30 minutes ago)' if d.get('reused') else ''}")
          for c in d.get('checks', []):
              print(f"  {c['status']:<5} {c['key']:<14} {c['detail']}")
          for g in d.get('gaps', []):
              print(f"  look  {g.get('key'):<14} {', '.join(map(str, g.get('items', [])))}")
          print(f"Important changes: {len(d.get('changes', []))}")
          if status == 'fail':
              print("::error::The system check found a problem. Open Settings > System check in the app.")
              sys.exit(1)
          PY
