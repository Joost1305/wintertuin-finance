# Keeps the free Supabase project awake: one small call every day.
# (The staff app pings the same project too; two pings do no harm.)
name: Supabase keepalive

on:
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC
  workflow_dispatch: {}      # run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping fin_ping()
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "https://foaoyjxzclvvdhuxvsck.supabase.co/rest/v1/rpc/fin_ping" \
            -H "apikey: sb_publishable_3GKB9Vp9F_fXz3kpSKLaCg_-MnA5z2v" \
            -H "Content-Type: application/json" -d '{}')
          echo "fin_ping: $code"
          test "$code" = "200"
