  <script>/* season follows the clock change: winter from the last Sunday of October, summer from the last Sunday of March */
  (function () { var d = new Date(), y = d.getFullYear(); function last(m) { var x = new Date(y, m + 1, 0); x.setDate(x.getDate() - x.getDay()); return x; }
    var s = d >= last(9) || d < last(2) ? 'winter' : 'summer'; try { s = localStorage.getItem('wt_season') || s; } catch (e) {}
    document.documentElement.dataset.season = s; })();</script>
  <script>/* phones and tablets get the tab bar at the bottom instead of the top menu */
  (function () { var q = window.matchMedia('(max-width: 820px), (pointer: coarse) and (max-width: 1366px)');
    var set = function () { document.documentElement.classList.toggle('touch-nav', q.matches); }; set();
    try { q.addEventListener('change', function () { set(); window.dispatchEvent(new Event('wt:touchnav')); }); } catch (e) {} })();</script>
